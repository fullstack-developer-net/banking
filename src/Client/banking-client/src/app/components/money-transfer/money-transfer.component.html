<div class="card p-4">
  <div class="modal-header">
    <span class="badge bg-blue-lt">Transfer money</span>
  </div>
  <div class="modal-body">
    <form (ngSubmit)="createTransaction()">
      <div class="mb-3">
        <label class="form-label">Recipient's ID</label>
        <input type="text" class="form-control" name="recipient-id" [(ngModel)]="recipientId"
          (ngModelChange)="getUserInfoByAccountId()" placeholder="Enter recipient's ID" required />
      </div>
      <div class="mb-3">
        <label class="form-label">Recipient's Username</label>
        <input type="text" class="form-control" name="recipient-username" [(ngModel)]="recipientUsername"
          placeholder="Enter recipient's username" required readonly />
      </div>
      <div class="mb-3">
        <label class="form-label">Amount</label>
        <input type="number" class="form-control" name="amount" [(ngModel)]="amount" placeholder="Enter amount"
          required />
      </div>

      <button type="submit" class="btn btn-primary" (click)="createTransaction()">Transfer</button>
    </form>


  </div>
</div>
<app-confirm-modal [show]="showConfirmModal" (confirm)="confirmTransaction()" (cancel)="cancelTransaction()">
</app-confirm-modal>
