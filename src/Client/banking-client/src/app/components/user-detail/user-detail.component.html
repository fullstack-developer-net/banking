<!-- src/app/components/user-detail/user-detail.component.html -->
<div class="container mx-auto p-4 bg-light">
  <div class="max-w-4xl mx-auto">
    <!-- Profile Overview -->
    <div class="text-center mb-4">
      <div class="position-relative">
        <img [src]="profileImage || 'https://images.unsplash.com/photo-1633332755192-727a05c4013d?ixlib=rb-1.2.1&auto=format&fit=crop&w=150&h=150'" alt="Profile" class="img-fluid rounded-circle border border-white shadow-lg" (click)="triggerFileInput()">
        <div class="position-absolute bottom-0 end-0 bg-primary p-2 rounded-circle text-white cursor-pointer">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
          </svg>
        </div>
      </div>
      <input type="file" #fileInput class="d-none" (change)="onFileSelected($event)" accept="image/*">
    </div>

    <!-- Personal Information -->
    <form [formGroup]="profileForm" class="bg-white rounded shadow p-4 mb-4">
      <h2 class="h4 mb-3">Personal Information</h2>
      <div class="row mb-3">
        <div class="col-md-6">
          <label class="form-label">Full Name</label>
          <input type="text" formControlName="fullName" class="form-control">
        </div>
        <div class="col-md-6">
          <label class="form-label">Date of Birth</label>
          <input type="date" formControlName="dob" class="form-control">
        </div>
      </div>
      <div class="row mb-3">
        <div class="col-md-6">
          <label class="form-label">Phone</label>
          <input type="text" [value]="maskedPhone" readonly class="form-control bg-light">
        </div>
        <div class="col-md-6">
          <label class="form-label">Email</label>
          <input type="text" [value]="maskedEmail" readonly class="form-control bg-light">
        </div>
      </div>
    </form>

    <!-- Account Details -->
    <div class="bg-white rounded shadow p-4 mb-4">
      <h2 class="h4 mb-3">Account Details</h2>
      <div class="row mb-3">
        <div class="col-md-6">
          <p>Account Number: <strong>{{accountDetails?.accountNumber}}</strong></p>
        </div>
        <div class="col-md-6">
          <p>Current Balance: <strong class="text-success">{{accountDetails?.balance | currency}}</strong></p>
        </div>
      </div>
    </div>

    <!-- Security Settings -->
    <div class="bg-white rounded shadow p-4 mb-4">
      <h2 class="h4 mb-3">Security Settings</h2>
      <div class="form-check">
        <input type="checkbox" [formControl]="twoFactorControl" class="form-check-input" id="twoFactor">
        <label class="form-check-label" for="twoFactor">Two-Factor Authentication</label>
      </div>
    </div>

    <!-- Quick Actions -->
    <div class="row">
      <div class="col-md-3">
        <button (click)="editProfile()" class="btn btn-primary w-100">Edit Profile</button>
      </div>
      <div class="col-md-3">
        <button (click)="openNotificationPreferences()" class="btn btn-primary w-100">Notifications</button>
      </div>
      <div class="col-md-3">
        <button (click)="contactSupport()" class="btn btn-primary w-100">Support</button>
      </div>
      <div class="col-md-3">
        <button (click)="downloadDetails()" class="btn btn-primary w-100">Download</button>
      </div>
    </div>
  </div>
</div>
