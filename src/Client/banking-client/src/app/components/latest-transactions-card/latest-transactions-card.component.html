<div class="card-container">
  <div class="card-body">
    <div class="header">
      <h2>Latest Transactions</h2>
    </div>

    @if (isLoading) {
      <div class="loading-state">
        Loading transactions...
      </div>
    }
    
    @if (error) {
      <div class="error-state">
        {{ error }}
      </div>
    }
    
    @if (!isLoading && !error) {
      @if (ListGroup.length === 0) {
        <div class="no-results">
          No transactions found.
        </div>
      } @else {
        <ul class="list-group list-group-flush">
          @for (item of ListGroup; track item.transactionId) {
            <app-transaction-item [value]="item"></app-transaction-item>
          }
        </ul>
      }
    }
    <div class="text-center mt-3">
      <a href="javascript:" class="b-b-primary text-primary f-w-500" (click)="viewAllTransactions()">
        View all
        <i class="ti ti-chevron-right"></i>
      </a>
    </div>
  </div>
</div>
